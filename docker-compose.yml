services:
  geopol:
    image: ghcr.io/paulbayfield/geo.bayfield.dev:latest
    build: .
    env_file: server/.env
    environment:
      # GeoPol's own database: the geopol-db service below (database and user "geopol").
      DATABASE_URL: postgres://geopol:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@geopol-db:5432/geopol
      DATABASE_POOL_MAX: "8"
      IMPORT_WORKERS: "2"
    ports:
      - "8840:8840"
    mem_limit: 1536m
    depends_on:
      geopol-db:
        condition: service_healthy
    restart: unless-stopped

  geopol-db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: geopol
      POSTGRES_USER: geopol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - geopol-db:/var/lib/postgresql/data
    # A 4 GB budget for GeoPol as a whole: 2.5 GB here (1 GB of shared buffers), 1.5 GB for the app.
    # For 8 GB: mem_limit 5g, shared_buffers=2GB, effective_cache_size=3GB, maintenance_work_mem=1GB
    # (and the app: mem_limit 3g, IMPORT_WORKERS 4).
    command: >
      -c shared_buffers=1GB -c effective_cache_size=1536MB -c work_mem=16MB -c maintenance_work_mem=512MB
      -c max_wal_size=4GB -c checkpoint_timeout=15min -c max_connections=30 -c random_page_cost=1.1
    mem_limit: 2560m
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geopol -d geopol"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  geopol-db:
