<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Self-hosted geocoding: autocomplete, search and reverse geocoding on OpenStreetMap data." />
    <title>GeoPol</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("geopol.settings") || "{}").theme || "system";
        document.documentElement.dataset.theme =
          t === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
        var v = JSON.parse(localStorage.getItem("geopol.themeVars") || "{}");
        for (var k in v) document.documentElement.style.setProperty(k, v[k]);
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
